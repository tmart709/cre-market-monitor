# What the dashboard tracks. Edit this file to add or remove anything.
#
# source:  yahoo = market prices, refreshed every hour while markets trade
#          fred  = official government data (daily, weekly, monthly or quarterly)
# unit:    pct   = a rate or yield (changes shown in basis points)
#          usd   = a price in dollars
#          index = an index level
#          bn    = billions of dollars
# scale:   optional multiplier (e.g. 0.001 turns millions into billions)
# note:    optional small text under the name (keep it in quotes)
#
# Find more: Yahoo symbols at finance.yahoo.com, FRED series IDs at fred.stlouisfed.org

groups:

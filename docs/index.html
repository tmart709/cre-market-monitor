<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRE Market Monitor</title>
<meta name="description" content="Rates, construction costs and real estate markets, refreshed hourly.">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CRE Monitor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #efeee9;
    --text: #1b1d21;
    --muted: #6b6f78;
    --border: #e3e1da;
    --accent: #2f5d8a;
    --up: #1f7a4d;
    --down: #b3372f;
    --shadow: 0 1px 2px rgba(20, 20, 20, .05), 0 2px 8px rgba(20, 20, 20, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --surface: #1d2025;
      --surface-2: #262a30;
      --text: #eceef1;
      --muted: #9aa0aa;
      --border: #2e3239;
      --accent: #7fb0e0;
      --up: #4cc28a;
      --down: #f07a70;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1d2025;
    --surface-2: #262a30;
    --text: #eceef1;
    --muted: #9aa0aa;
    --border: #2e3239;
    --accent: #7fb0e0;
    --up: #4cc28a;
    --down: #f07a70;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; }

  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .updated { color: var(--muted); font-size: 13px; text-align: right; }
  .updated.old { color: var(--down); }
  .tabs {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    padding: 12px 0; margin: 0 -16px; padding-inline: 16px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 1px solid var(--border); background: var(--surface);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  main { padding: 8px 16px 32px; }
  section { margin-top: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; text-align: left; width: 100%;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: end;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .label { font-weight: 600; font-size: 14px; grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
  .note { color: var(--muted); font-size: 12px; grid-column: 1 / -1; min-height: 1em; margin-bottom: 6px; }
  .value { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .change { font-size: 13px; font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .spark { grid-row: 3 / span 2; grid-column: 2; width: 96px; height: 40px; }
  .meta { color: var(--muted); font-size: 11.5px; grid-column: 1 / -1; margin-top: 6px; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
  .badge.stale { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  /* detail sheet */
  dialog {
    border: none; padding: 0; background: var(--surface); color: var(--text);
    width: min(720px, 100%); max-width: 100%; max-height: 92vh; border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(10, 12, 15, .45); }
  @media (max-width: 640px) {
    dialog { margin: auto 0 0; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  }
  .sheet { padding: 18px 18px 20px; }
  .sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .sheet h3 { margin: 0; font-size: 18px; }
  .close { border: none; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
  .big { font-size: 30px; font-weight: 650; margin-top: 6px; }
  .ranges { display: flex; gap: 4px; margin: 14px 0 8px; }
  .ranges button { border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .ranges button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chart { position: relative; }
  .chart svg { width: 100%; height: 220px; display: block; touch-action: pan-y; }
  .readout { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .stat span { display: block; font-size: 11.5px; color: var(--muted); }
  .stat b { font-size: 15px; }
  .src { margin-top: 14px; font-size: 13px; }
  .src a { color: var(--accent); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 16px 28px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>CRE Market Monitor</h1>
      <div class="updated" id="updated">Loading…</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading data…</div></main>
<footer>Market prices from Yahoo Finance (may be delayed ~15 min). Official data from FRED, Federal Reserve Bank of St. Louis. For information only.</footer>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <h3 id="sheet-title"></h3>
        <div class="note" id="sheet-note"></div>
      </div>
      <button class="close" id="close" aria-label="Close">×</button>
    </div>
    <div class="big" id="sheet-value"></div>
    <div class="change" id="sheet-change"></div>
    <div class="ranges" id="ranges"></div>
    <div class="readout" id="readout">&nbsp;</div>
    <div class="chart" id="chart"></div>
    <div class="stats" id="stats"></div>
    <div class="src" id="src"></div>
  </div>
</dialog>

<script>
const DATA_URL = "data/market.json";
const RANGES = [["1M", 31], ["3M", 92], ["6M", 183], ["1Y", 366], ["All", Infinity]];
let data = null, activeTab = "All", current = null, currentRange = "3M";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function parseDate(s) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  return new Date(s);
}

function fmtValue(v, unit) {
  if (v == null) return "–";
  const n = (d) => v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  switch (unit) {
    case "pct": return n(2) + "%";
    case "bn": return "$" + v.toLocaleString(undefined, { maximumFractionDigits: 0 }) + "B";
    case "index": return n(Math.abs(v) >= 100 ? 1 : 2);
    default: return "$" + n(Math.abs(v) < 10 ? 3 : 2);
  }
}

function fmtChange(v, base, unit) {
  if (v == null || base == null) return { text: "", cls: "flat" };
  const diff = v - base;
  const cls = Math.abs(diff) < 1e-9 ? "flat" : diff > 0 ? "up" : "down";
  const arrow = cls === "up" ? "▲" : cls === "down" ? "▼" : "•";
  const sign = diff > 0 ? "+" : diff < 0 ? "−" : "";
  if (unit === "pct") return { text: `${arrow} ${sign}${Math.abs(diff * 100).toFixed(0)} bps`, cls };
  const pct = base ? (diff / Math.abs(base)) * 100 : 0;
  const abs = unit === "bn" ? Math.abs(diff).toFixed(0) : Math.abs(diff).toFixed(Math.abs(base) < 10 ? 3 : 2);
  return { text: `${arrow} ${sign}${abs} (${sign}${Math.abs(pct).toFixed(2)}%)`, cls };
}

function fmtAsOf(item) {
  const d = parseDate(item.as_of);
  if (isNaN(d)) return "";
  if (item.as_of.length > 10) return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  return h < 48 ? `${h} hr ago` : `${Math.round(h / 24)} days ago`;
}

function sliceRange(history, days) {
  if (!isFinite(days) || !history.length) return history;
  const end = parseDate(history[history.length - 1][0]);
  const cutoff = new Date(end); cutoff.setDate(cutoff.getDate() - days);
  const out = history.filter(([d]) => parseDate(d) >= cutoff);
  return out.length >= 2 ? out : history.slice(-Math.min(history.length, 12));
}

function sparkline(item) {
  let pts = sliceRange(item.history, 92);
  if (pts.length < 12) pts = item.history.slice(-12);
  const vals = pts.map((p) => p[1]);
  if (vals.length < 2) return "";
  const w = 96, h = 40, min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const d = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 3 - (v - min) / span * (h - 6)).toFixed(1)}`).join(" L");
  const cls = vals[vals.length - 1] >= vals[0] ? "up" : "down";
  return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="M${d}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function card(item) {
  const ch = fmtChange(item.value, item.prev, item.unit);
  const badge = item.stale ? `<span class="badge stale">stale</span>` : "";
  return `<button class="card" data-key="${esc(item.key)}">
    <div class="label">${esc(item.label)} ${badge}</div>
    <div class="note">${esc(item.note)}</div>
    <div class="value">${fmtValue(item.value, item.unit)}</div>
    ${sparkline(item)}
    <div class="change ${ch.cls}">${ch.text || "&nbsp;"}</div>
    <div class="meta">${esc(item.symbol)} · ${item.source === "fred" ? "FRED" : "Yahoo"} · ${fmtAsOf(item)}</div>
  </button>`;
}

function render() {
  const groups = data.groups.filter((g) => g.items.length);
  $("tabs").innerHTML = ["All", ...groups.map((g) => g.name)]
    .map((n) => `<button class="tab" aria-pressed="${n === activeTab}" data-tab="${esc(n)}">${esc(n)}</button>`).join("");
  const shown = activeTab === "All" ? groups : groups.filter((g) => g.name === activeTab);
  $("main").innerHTML = shown.length
    ? shown.map((g) => `<section><h2>${esc(g.name)}</h2><div class="grid">${g.items.map(card).join("")}</div></section>`).join("")
    : `<div class="empty">No data yet.</div>`;
  renderUpdated();
}

function renderUpdated() {
  if (!data) return;
  const hrs = (Date.now() - new Date(data.updated)) / 3.6e6;
  $("updated").textContent = `Updated ${ago(data.updated)}`;
  $("updated").title = new Date(data.updated).toLocaleString();
  $("updated").classList.toggle("old", hrs > 3);
}

function findItem(key) {
  for (const g of data.groups) for (const i of g.items) if (i.key === key) return i;
}

function openSheet(item) {
  current = item;
  $("sheet-title").textContent = item.label;
  $("sheet-note").textContent = [item.note, `${item.symbol} · as of ${fmtAsOf(item)}`].filter(Boolean).join(" · ");
  $("sheet-value").textContent = fmtValue(item.value, item.unit);
  const ch = fmtChange(item.value, item.prev, item.unit);
  $("sheet-change").className = "change " + ch.cls;
  $("sheet-change").textContent = ch.text ? `${ch.text} since ${item.prev_date ? parseDate(item.prev_date).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "previous"}` : "";
  $("src").innerHTML = item.source === "fred"
    ? `<a href="https://fred.stlouisfed.org/series/${encodeURIComponent(item.symbol)}" target="_blank" rel="noopener">View on FRED ↗</a>`
    : `<a href="https://finance.yahoo.com/quote/${encodeURIComponent(item.symbol)}" target="_blank" rel="noopener">View on Yahoo Finance ↗</a>`;
  $("sheet").showModal();  // open first so the chart can measure its width
  drawRange(currentRange);
}

function drawRange(name) {
  currentRange = name;
  $("ranges").innerHTML = RANGES.map(([n]) => `<button data-range="${n}" aria-pressed="${n === name}">${n}</button>`).join("");
  const pts = sliceRange(current.history, Object.fromEntries(RANGES)[name]);
  drawChart(pts, current.unit);
  const vals = pts.map((p) => p[1]);
  const first = vals[0], last = vals[vals.length - 1];
  const ch = fmtChange(last, first, current.unit);
  $("stats").innerHTML = `
    <div class="stat"><span>${name} change</span><b class="${ch.cls}">${ch.text.replace(/^[▲▼•] /, "") || "–"}</b></div>
    <div class="stat"><span>${name} high</span><b>${fmtValue(Math.max(...vals), current.unit)}</b></div>
    <div class="stat"><span>${name} low</span><b>${fmtValue(Math.min(...vals), current.unit)}</b></div>`;
}

function drawChart(pts, unit) {
  const W = Math.max(280, $("chart").clientWidth || 680), H = 220, padL = 4, padR = 62, padT = 10, padB = 24;
  const vals = pts.map((p) => p[1]);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08; min -= pad; max += pad;
  const x = (i) => padL + (pts.length < 2 ? 0 : i / (pts.length - 1) * (W - padL - padR));
  const y = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" L");
  const cls = vals[vals.length - 1] >= vals[0] ? "up" : "down";
  const ticks = [0, 0.5, 1].map((t) => min + pad + t * (max - min - 2 * pad));
  const fmtD = (s) => parseDate(s).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "2-digit" });
  $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="${cls}" role="img" aria-label="${esc(current.label)} chart">
    ${ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${W - padR + 6}" y="${y(t) + 4}" font-size="11" fill="var(--muted)">${fmtValue(t, unit)}</text>`).join("")}
    <path d="M${padL},${H - padB} L${line} L${x(pts.length - 1)},${H - padB} Z" fill="currentColor" opacity=".08"/>
    <path d="M${line}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <text x="${padL}" y="${H - 6}" font-size="11" fill="var(--muted)">${fmtD(pts[0][0])}</text>
    <text x="${W - padR}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtD(pts[pts.length - 1][0])}</text>
    <line id="cross" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
  </svg>`;
  const svg = $("chart").querySelector("svg"), cross = svg.querySelector("#cross");
  const show = (e) => {
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((sx - padL) / (W - padL - padR) * (pts.length - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    $("readout").textContent = `${parseDate(pts[i][0]).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}: ${fmtValue(pts[i][1], unit)}`;
  };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); $("readout").innerHTML = "&nbsp;"; });
}

async function load() {
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    if (activeTab !== "All" && !data.groups.some((g) => g.name === activeTab)) activeTab = "All";
    render();
  } catch (e) {
    if (!data) $("main").innerHTML = `<div class="empty">Couldn't load data yet. The first hourly update may still be running.</div>`;
  }
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  activeTab = b.dataset.tab; render();
  try { localStorage.setItem("tab", activeTab); } catch {}
});
$("main").addEventListener("click", (e) => {
  const c = e.target.closest(".card"); if (c) openSheet(findItem(c.dataset.key));
});
$("ranges").addEventListener("click", (e) => {
  const b = e.target.closest("[data-range]"); if (b) drawRange(b.dataset.range);
});
$("close").addEventListener("click", () => $("sheet").close());
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").close(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

try { activeTab = localStorage.getItem("tab") || "All"; } catch {}
load();
setInterval(load, 10 * 60 * 1000);
setInterval(renderUpdated, 60 * 1000);
</script>
</body>
</html>
